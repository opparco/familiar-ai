<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ avatar_full_name }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app">
        <div class="main">
            <div class="chat-panel">
                <div class="messages" id="output"></div>
            </div>
            <div class="input-row">
                <input type="text" id="input" autofocus>
                <button id="btn-send">Send</button>
                <button id="btn-clear">Clear</button>
            </div>
        </div>

        <div class="side-panel">
            <div class="avatar-box">
                <img id="avatar-img" src="/static/character-images/open_close.png" alt="{{ avatar_name_upper }}">
            </div>
            <div class="status-panel" id="status-panel">
                <span id="status-text">Waiting for server connection...</span>
            </div>
        </div>
    </div>

    <script>
        const appConfig = {{ app_config_json }};
    </script>
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
