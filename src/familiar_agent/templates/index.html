<!-- AIチャットインターフェース：ターミナル風UIでAIアシスタントと対話 -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ avatar_full_name }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- ターミナル風UI -->
    <div class="terminal">
        <div class="chat-area">
            <div class="chat-container">
                <!-- チャット出力エリア -->
                <div class="output" id="output">
                    <div class="line system">&gt; SYSTEM: {{ avatar_full_name }} Online</div>
                </div>
                
                <!-- アバター表示エリア -->
                <div class="avatar-area">
                    <img id="avatar-img" src="/static/character-images/open_close.png" alt="{{ avatar_name_upper }}">
                    <div class="avatar-label">{{ avatar_name_upper }}</div>
                </div>
            </div>
            
            <!-- 入力エリア -->
            <div class="input-line">
                <span class="prompt">&gt;</span>
                <input type="text" id="input" autofocus>
            </div>
        </div>
    </div>

    <script>
        // 設定値をJavaScript変数に格納
        const appConfig = {{ app_config_json }};
    </script>
    
    <!-- モジュールを読み込み（WebSocket版） -->
    <script type="module" src="/static/js/app_ws.js"></script>
</body>
</html>
